# =============================================================================
#  box.conf: settings for your custom Bliss OS (Android) TV box image.
#  Edit this file, then run ./scripts/build.sh
# =============================================================================

# ---- Identity ---------------------------------------------------------------
# Shown as the device name in Settings, on your network, and over Bluetooth.
BOX_NAME="MyIPTV Box"
# Your own version number for this image. Stored as ro.myiptv.version.
BOX_VERSION="1.0"

# ---- Base Android version ---------------------------------------------------
# typhoon-x86  = Bliss OS 16 (Android 13). Needs about 16 GB RAM to build. Recommended.
# universe-x86 = Bliss OS 17 (Android 14). Needs about 24-32 GB RAM to build.
BLISS_BRANCH="typhoon-x86"

# Extra apps and services baked in by Bliss:
#   vanilla = no Google apps
#   gapps   = Google Play Store and Play Services (MindTheGapps)
#   foss    = microG plus open-source apps instead of Google
#   microg  = microG only
BLISS_BUILD_VARIANT="gapps"

# userdebug (recommended, ADB-friendly) or user (locked down).
BUILD_TYPE="userdebug"

# Leave empty to pick automatically from BLISS_BRANCH.
LUNCH_TARGET=""

# Include the prebuilt Widevine DRM library (L3 only on x86).
# Lets some streaming apps play, usually at SD quality.
USE_WIDEVINE="false"

# ---- TV behaviour -----------------------------------------------------------
# Package name of the launcher to set as the Home screen on first boot.
# Its APK must be in apps/user/ (or come from your gapps/foss variant).
# Example: Projectivy Launcher = com.spocky.projengmenu
DEFAULT_LAUNCHER=""

# Keep the screen on forever (no sleep, no screensaver). Normal for a TV box.
SCREEN_NEVER_OFF="true"

# Hide Bliss's desktop-style taskbar.
DISABLE_TASKBAR="true"

# Skip the setup wizard on first boot.
DISABLE_SETUP_WIZARD="true"

# Report the system as a TV ("android.software.leanback").
# On:  TV-only apps install and show their TV interface.
# Off: those apps may refuse to install, or show the phone/tablet interface.
# Turning it on can confuse some tablet apps. Test both ways.
ADVERTISE_LEANBACK="false"

# Remove the extra apps Bliss bundles (F-Droid, Open Camera, Material Files, XtMapper).
REMOVE_BLISS_USER_APPS="true"

# Space-separated package names to disable on every boot (bloat you don't want).
# Example: "com.android.calendar com.android.contacts"
DISABLE_PACKAGES=""

# Default timezone, for example "America/New_York". Leave empty to keep Bliss's default.
TIMEZONE=""

# ---- Build machine ----------------------------------------------------------
# Where the Bliss OS source gets downloaded (~200 GB). Needs a fast SSD.
SRC_DIR="$HOME/bliss-src"
# Parallel jobs. Empty = number of CPU cores.
JOBS=""

name: Build car launcher APK

on:
  push:
    paths:
      - "car-launcher/**"
      - ".github/workflows/car-launcher.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car-launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: car-launcher-apk
          path: car-launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
